[project]
name = "matcause"
version = "0.1.0"
description = "MatCause — 소재·공정 결함 원인 판별 및 대응 피드백 에이전트"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MatCause Team" }]

# 코어 실행에 필요한 최소 의존성.
# 무거운 과학 패키지(pymatgen, faiss 등)는 optional-dependencies로 분리해
# 트랙별로 필요한 것만 설치할 수 있게 한다.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "boto3>=1.34",            # AWS Bedrock (bedrock-runtime)
    "streamlit>=1.36",        # 데모 대시보드
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "xhtml2pdf>=0.2.16",     # 순수 파이썬 PDF 생성(외부 바이너리 불필요)
]

[project.optional-dependencies]
# Track-MAT: Materials Project 소재 경로
materials = [
    "mp-api>=0.41",
    "pymatgen>=2024.5.1",
]
# Track-PROC: SECOM 공정 경로 (통계 + ML)
process = [
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "imbalanced-learn>=0.12",
    "ucimlrepo>=0.0.7",      # UCI SECOM 데이터셋(id=179) 다운로드
]
# Track-CORE: RAG / 벡터 검색
rag = [
    "faiss-cpu>=1.8",
]
# 파일 파싱(PDF 등)
files = [
    "pypdf>=4.2",
]
# 개발/테스트
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
# 전체 설치 (개발 편의)
all = [
    "mp-api>=0.41",
    "pymatgen>=2024.5.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "imbalanced-learn>=0.12",
    "ucimlrepo>=0.0.7",
    "faiss-cpu>=1.8",
    "pypdf>=4.2",
]

[project.scripts]
matcause-api = "matcause.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matcause"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
